<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1A1410">
<title>TapMyGym - Админ</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Tap<b>My</b>Gym <span class="hint" style="font:500 14px Barlow,sans-serif">Admin</span></div>
  <div class="row">
    <div class="seg" role="group" aria-label="Language"><button data-l="bg" aria-pressed="true">БГ</button><button data-l="en" aria-pressed="false">EN</button></div>
    <a class="btn ghost sm" id="viewLink" href="menu.html" style="text-decoration:none"></a>
    <button class="btn ghost sm" id="outBtn" hidden></button>
  </div>
</div></header>

<main class="wrap">
  <section class="login" id="login">
    <div class="tablet">
      <h1 id="lT"></h1>
      <div class="demo" id="demo" hidden></div>
      <form id="lf" autocomplete="on">
        <label><span id="lE"></span><input type="email" name="email" autocomplete="username" required></label>
        <label><span id="lP"></span><input type="password" name="pw" autocomplete="current-password" required></label>
        <div class="err" id="err" role="alert"></div>
        <button class="btn" type="submit" id="lGo"></button>
        <button class="link" type="button" id="lForgot"></button>
      </form>
    </div>
  </section>

  <section id="app" hidden>
    <div class="hero" style="padding:24px 0 8px;grid-template-columns:1fr"><h1 id="aT" style="font-size:44px"></h1></div>
    <div class="reqs" id="reqs" aria-live="polite"></div>
    <div class="chips" id="tabs"></div>
    <div class="admin on">
      <div><strong id="cnt"></strong><div class="hint" id="aH"></div></div>
      <div class="row">
        <button class="btn sm" id="addBtn"></button>
        <span class="row" id="exTools"><button class="btn ghost sm" id="csvBtn"></button>
        <button class="btn ghost sm" id="expBtn"></button>
        <button class="btn ghost sm" id="impBtn"></button>
        <input type="file" id="impFile" accept="application/json" hidden>
        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden></span>
      </div>
    </div>
    <div class="items" id="items"></div>
  </section>
</main>

<div class="modal" id="formM" role="dialog" aria-modal="true"><div class="sheet" id="formS"></div></div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script>
/* Firebase config lives in firebase-config.js. Collections used: exercises, coaches, calls. */

const A={
bg:{lT:"Вход",lE:"Имейл",lP:"Парола",lGo:"Вход",forgot:"Забравена парола",sent:"Изпратихме имейл за нова парола.",needEmail:"Въведете имейл първо.",bad:"Грешен имейл или парола.",fail:"Входът не успя. Опитайте пак.",demo:"Демо режим: Firebase още не е свързан. Всеки имейл и парола влизат, а данните стоят само в този браузър.",out:"Изход",view:"Към менюто",aT:"Упражнения",aH:"Промените се виждат веднага в менюто.",add:"+ Ново упражнение",csv:"Импорт на CSV",exp:"Експорт",imp:"Импорт",edit:"Редакция",empty:"Още няма упражнения. Добавете първото.",sample:"Добави примерни упражнения",cnt:" упражнения",sets:"Серии",lv:{beginner:"Начинаещ",intermediate:"Среден",advanced:"Напреднал"},nameBg:"Име (БГ)",nameEn:"Име (EN)",cat:"Категория",level:"Ниво",setsrepsL:"Серии x повторения",eqL:"Уред / оборудване",vid:"Линк към видео",vidH:"YouTube, Vimeo или директен .mp4 линк",descBg:"Описание и съвети (БГ)",descEn:"Описание и съвети (EN)",save:"Запази",cancel:"Отказ",del:"Изтрий",delQ:"Да изтрия ли това упражнение?",saved:"Запазено",deleted:"Изтрито",needName:"Въведете име на упражнението",imported:"Импортирано",badFile:"Файлът не е валиден",newT:"Ново упражнение",editT:"Редакция",csvQ:"Да заменя ли текущите упражнения с тези от CSV? ОК = замени, Отказ = добави към тях.",csvNone:"Не открих редове с име. Проверете заглавията на колоните.",csvN:" реда от CSV",saveFail:"Записът не успя",tabEx:"Упражнения",tabCo:"Треньори",addCo:"+ Нов треньор",cntCo:" треньори",coachName:"Име",coachRole:"Специалност (напр. Силови тренировки)",coachPhoto:"Линк към снимка (по избор)",coachEmpty:"Още няма треньори. Добавете първия.",coachNewT:"Нов треньор",coachEditT:"Редакция на треньор",delQc:"Да изтрия ли този треньор?",reqCalled:" е повикан в ",done:"Готово",coachEmail:"Имейл за вход на треньора (по избор)",coachEmailH:"Треньорът влиза в trainer.html с този имейл. Първо създайте потребителя във Firebase Authentication.",cuT:"Създаване на треньор",cuSub:"Създава треньор и акаунт за вход в панела на треньорите.",cuName:"Име",cuEmail:"Имейл",cuPw:"Парола",cuPw2:"Потвърди паролата",cuBtn:"Създай треньор",close:"Затвори",pwMin:"Паролата трябва да е поне 6 символа.",pwMatch:"Паролите не съвпадат.",emailUsed:"Този имейл вече има акаунт.",badEmail:"Невалиден имейл.",signupOff:"Създаването на акаунти е изключено във Firebase (Authentication → Settings → User actions).",created:"Треньорът е създаден",tabCa:"Карти",addCa:"+ Нова карта",cntCa:" карти",cardCode:"Код / сериен номер на картата",cardCodeH:"Същият код като в линка на картата. Позволени: букви, цифри, - и _.",cardName:"Име на мястото (БГ)",cardNameEn:"Име на мястото (EN)",cardNew:"Нова карта",cardEdit:"Редакция на карта",cardEmpty:"Още няма карти. Добавете първата.",copyLink:"Копирай линк",copied:"Линкът е копиран",codeUsed:"Този код вече съществува",needCode:"Въведете код на картата",delQk:"Да изтрия ли тази карта?"},
en:{lT:"Sign in",lE:"Email",lP:"Password",lGo:"Sign in",forgot:"Forgot password",sent:"We sent a password reset email.",needEmail:"Enter your email first.",bad:"Wrong email or password.",fail:"Sign-in failed. Try again.",demo:"Demo mode: Firebase isn't connected yet. Any email and password work, and data stays in this browser only.",out:"Sign out",view:"View menu",aT:"Exercises",aH:"Changes show up in the menu right away.",add:"+ New exercise",csv:"Import CSV",exp:"Export",imp:"Import",edit:"Edit",empty:"No exercises yet. Add the first one.",sample:"Add sample exercises",cnt:" exercises",sets:"Sets",lv:{beginner:"Beginner",intermediate:"Intermediate",advanced:"Advanced"},nameBg:"Name (BG)",nameEn:"Name (EN)",cat:"Category",level:"Level",setsrepsL:"Sets x reps",eqL:"Equipment",vid:"Video link",vidH:"YouTube, Vimeo or a direct .mp4 link",descBg:"Description and tips (BG)",descEn:"Description and tips (EN)",save:"Save",cancel:"Cancel",del:"Delete",delQ:"Delete this exercise?",saved:"Saved",deleted:"Deleted",needName:"Enter an exercise name",imported:"Imported",badFile:"That file is not valid",newT:"New exercise",editT:"Edit exercise",csvQ:"Replace the current exercises with the CSV rows? OK = replace, Cancel = add to them.",csvNone:"No rows with a name found. Check the column headers.",csvN:" rows from CSV",saveFail:"Could not save",tabEx:"Exercises",tabCo:"Coaches",addCo:"+ New coach",cntCo:" coaches",coachName:"Name",coachRole:"Specialty (e.g. Strength training)",coachPhoto:"Photo link (optional)",coachEmpty:"No coaches yet. Add the first one.",coachNewT:"New coach",coachEditT:"Edit coach",delQc:"Delete this coach?",reqCalled:" was called at ",done:"Done",coachEmail:"Trainer login email (optional)",coachEmailH:"The trainer signs in at trainer.html with this email. Create the user in Firebase Authentication first.",cuT:"Create trainer",cuSub:"Creates a trainer and a login account for the trainer panel.",cuName:"Name",cuEmail:"Email",cuPw:"Password",cuPw2:"Confirm password",cuBtn:"Create trainer",close:"Close",pwMin:"Password must be at least 6 characters.",pwMatch:"Passwords do not match.",emailUsed:"This email already has an account.",badEmail:"Invalid email.",signupOff:"Account creation is turned off in Firebase (Authentication → Settings → User actions).",created:"Trainer created",tabCa:"Cards",addCa:"+ New card",cntCa:" cards",cardCode:"Card code / serial number",cardCodeH:"The same code as in the card link. Allowed: letters, digits, - and _.",cardName:"Place name (BG)",cardNameEn:"Place name (EN)",cardNew:"New card",cardEdit:"Edit card",cardEmpty:"No cards yet. Add the first one.",copyLink:"Copy link",copied:"Link copied",codeUsed:"This code already exists",needCode:"Enter the card code",delQk:"Delete this card?"}};
const SEED=[
{nb:"Лег с щанга",ne:"Barbell bench press",cat:"Гърди",lv:"intermediate",sets:"4 x 8",eq:"Щанга, лавица",vid:"",db:"Легнете на лавицата, стъпала на пода. Свалете щангата до средата на гърдите и избутайте контролирано.",de:"Lie on the bench, feet flat. Lower the bar to mid-chest and press up with control."},
{nb:"Набирания",ne:"Pull-ups",cat:"Гръб",lv:"intermediate",sets:"3 x 8",eq:"Лост",vid:"",db:"Хват малко по-широк от раменете. Дръпнете брадичката над лоста без люлеене.",de:"Grip just wider than shoulders. Pull your chin over the bar without swinging."},
{nb:"Клек",ne:"Back squat",cat:"Крака",lv:"intermediate",sets:"4 x 6",eq:"Щанга, стойка",vid:"",db:"Гръб прав, коленете следват посоката на пръстите.",de:"Keep your back straight, knees tracking over toes."},
{nb:"Планк",ne:"Plank",cat:"Корем",lv:"beginner",sets:"3 x 45 сек",eq:"Постелка",vid:"",db:"Тялото е права линия от глава до пети.",de:"Body in a straight line from head to heels."}];
const KEY="tmg.v1";
let S={lang:"bg",items:[],coaches:[],links:[],cards:[],reqs:[],tab:"ex"},fs=null,auth=null,unsub=null,reqN=-1;
const $=id=>document.getElementById(id),t=()=>A[S.lang];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function toast(m){const x=$("toast");x.textContent=m;x.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display="none",2200)}
const nm=i=>(S.lang==="en"?i.ne||i.nb:i.nb||i.ne)||"";

/* ---------- data layer (Firestore or local demo) ---------- */
const LK={exercises:"tmg.v1",coaches:"tmg.coaches",coachAuth:"tmg.coachAuth",cards:"tmg.cards"};
const lget=c=>{try{const r=JSON.parse(localStorage.getItem(LK[c]));if(Array.isArray(r))return r}catch(e){}return c==="exercises"?SEED.map((o,n)=>({...o,id:"s"+n})):[]};
const lput=(c,a)=>{try{localStorage.setItem(LK[c],JSON.stringify(a))}catch(e){}};
async function loadC(c){if(fs){const s=await fs.collection(c).get();return s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0))}return lget(c)}
async function saveC(c,o){let id=o.id;
  if(fs){const d={...o};delete d.id;if(id)await fs.collection(c).doc(id).set(d);else{d.ts=Date.now();const r=await fs.collection(c).add(d);id=r.id}}
  else{const a=lget(c);if(!o.id)o.id="e"+Date.now();id=o.id;const i=a.findIndex(x=>x.id===o.id);i>=0?a[i]=o:a.push(o);lput(c,a)}
  return id}
async function removeC(c,id){if(fs)await fs.collection(c).doc(id).delete();else lput(c,lget(c).filter(x=>x.id!==id))}
async function linkTrainer(coachId,email,prev,uid){email=(email||"").trim().toLowerCase();prev=prev||"";
  if(fs){const c=fs.collection("coachAuth");if(prev&&prev!==email)await c.doc(prev).delete();if(email)await c.doc(email).set({coachId,uid:uid||null})}
  else{const a=lget("coachAuth").filter(x=>x.id!==prev&&x.id!==email);if(email)a.push({id:email,coachId});lput("coachAuth",a)}}
const lkOf=id=>S.links.find(l=>l.coachId===id);
const save=o=>saveC("exercises",o),remove=id=>removeC("exercises",id);
async function bulk(arr,replace){
  if(fs){const c=fs.collection("exercises");
    if(replace){const s=await c.get();for(let i=0;i<s.docs.length;i+=400){const b=fs.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
    for(let i=0;i<arr.length;i+=400){const b=fs.batch();arr.slice(i,i+400).forEach((o,n)=>{const d={...o};delete d.id;d.ts=Date.now()+i+n;b.set(c.doc(),d)});await b.commit()}}
  else{const w=arr.map((o,n)=>({...o,id:"b"+Date.now()+"_"+n}));lput("exercises",replace?w:lget("exercises").concat(w))}}
async function refresh(){S.items=await loadC("exercises");S.coaches=await loadC("coaches");try{S.links=await loadC("coachAuth")}catch(e){S.links=[]}try{S.cards=await loadC("cards")}catch(e){S.cards=[]}paintList()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.3)}catch(e){}}
function listenReqs(){if(!fs||unsub)return;reqN=-1;
  unsub=fs.collection("calls").where("done","==",false).onSnapshot(s=>{S.reqs=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0));if(reqN>=0&&S.reqs.length>reqN)beep();reqN=S.reqs.length;paintReqs()},e=>console.error(e))}
const av=c=>`<span class="av">${esc((c.name||"?").trim().charAt(0).toUpperCase())}${c.photo?`<img src="${esc(c.photo)}" alt="" onerror="this.remove()">`:""}</span>`;

/* ---------- UI ---------- */
function paintStatic(){const x=t();
  $("lT").textContent=x.lT;$("lE").textContent=x.lE;$("lP").textContent=x.lP;$("lGo").textContent=x.lGo;$("lForgot").textContent=x.forgot;
  $("demo").textContent=x.demo;$("demo").hidden=!!FIREBASE_CONFIG;
  $("outBtn").textContent=x.out;$("viewLink").textContent=x.view;
  $("aT").textContent=x.aT;$("aH").textContent=x.aH;$("addBtn").textContent=x.add;$("csvBtn").textContent=x.csv;$("expBtn").textContent=x.exp;$("impBtn").textContent=x.imp;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));document.documentElement.lang=S.lang;
  if(!$("app").hidden)paintList()}
function paintReqs(){const x=t();$("reqs").innerHTML=S.reqs.map(r=>`<div class="req"><span>🔔 <b>${esc(r.coachName)}</b>${x.reqCalled}${new Date(r.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${r.spot||r.card?` · 📍 <b>${esc(r.spot||r.card)}</b>`:""}</span><button class="btn sm" data-r="${esc(r.id)}">${x.done}</button></div>`).join("")}
function paintList(){const x=t(),tb=S.tab;
  $("tabs").innerHTML=[["ex",x.tabEx],["co",x.tabCo],["ca",x.tabCa]].map(([k,l])=>`<button class="chip" data-t="${k}" aria-pressed="${tb===k}">${l}</button>`).join("");
  $("exTools").hidden=tb!=="ex";$("addBtn").textContent=tb==="co"?x.addCo:tb==="ca"?x.addCa:x.add;
  $("cnt").textContent=tb==="co"?S.coaches.length+x.cntCo:tb==="ca"?S.cards.length+x.cntCa:S.items.length+x.cnt;
  let h;
  if(tb==="co")h=S.coaches.length?S.coaches.map(c=>`<div class="it"><div class="row">${av(c)}<div><h3>${esc(c.name)}</h3><div class="meta"><span>${esc(c.role||"")}</span>${lkOf(c.id)?`<span>🔑 ${esc(lkOf(c.id).id)}</span>`:""}</div></div></div><button class="btn ghost sm" data-ce="${esc(c.id)}">${x.edit}</button></div>`).join(""):`<div class="empty">${x.coachEmpty}</div>`;
  else if(tb==="ca")h=S.cards.length?S.cards.map(k=>`<div class="it"><div style="min-width:0"><h3>📍 ${esc(k.name||k.nameEn||"")}</h3><div class="meta"><span>${esc(k.id)}</span></div><div class="hint" style="word-break:break-all">${esc(cardUrl(k.id))}</div></div><div class="row"><button class="btn ghost sm" data-cp="${esc(k.id)}">${x.copyLink}</button><button class="btn ghost sm" data-cae="${esc(k.id)}">${x.edit}</button></div></div>`).join(""):`<div class="empty">${x.cardEmpty}</div>`;
  else h=S.items.length?S.items.map(i=>`<div class="it"><div><h3>${esc(nm(i))}</h3><div class="meta">${i.cat?`<span>${esc(i.cat)}</span>`:""}<span>${esc(x.lv[i.lv]||"")}</span>${i.sets?`<span>${esc(i.sets)}</span>`:""}<span>${i.vid?"▶":"-"}</span></div></div><button class="btn ghost sm" data-e="${esc(i.id)}">${x.edit}</button></div>`).join(""):`<div class="empty">${x.empty}<br><br><button class="btn sm" id="seedBtn">${x.sample}</button></div>`;
  $("items").innerHTML=h;paintReqs()}
function showApp(){$("login").hidden=true;$("app").hidden=false;$("outBtn").hidden=false;listenReqs();refresh().catch(()=>toast(t().saveFail))}
function showLogin(){if(unsub){unsub();unsub=null}S.reqs=[];$("login").hidden=false;$("app").hidden=true;$("outBtn").hidden=true}

$("lf").onsubmit=async e=>{e.preventDefault();$("err").textContent="";const d=Object.fromEntries(new FormData(e.target));
  if(!auth){showApp();return}
  try{await auth.signInWithEmailAndPassword(d.email,d.pw)}
  catch(er){$("err").textContent=/invalid-credential|wrong-password|user-not-found|invalid-login/.test(er.code||"")?t().bad:t().fail}};
$("lForgot").onclick=async()=>{const m=$("lf").elements.email.value.trim();if(!m){$("err").textContent=t().needEmail;return}
  if(auth){try{await auth.sendPasswordResetEmail(m);$("err").textContent=t().sent}catch(er){$("err").textContent=t().fail}}};
$("outBtn").onclick=async()=>{if(auth)await auth.signOut();else showLogin()};

function openForm(id){const x=t(),i=S.items.find(a=>a.id===id)||{id:"",nb:"",ne:"",cat:"",lv:"beginner",sets:"",eq:"",vid:"",db:"",de:""};
  const cats=[...new Set(S.items.map(a=>a.cat).filter(Boolean))];
  $("formS").innerHTML=`<button class="close" data-x="1" aria-label="Close">✕</button><h2>${id?x.editT:x.newT}</h2>
  <form id="f" data-id="${esc(i.id)}">
   <div class="two"><label>${x.nameBg}<input name="nb" value="${esc(i.nb)}"></label><label>${x.nameEn}<input name="ne" value="${esc(i.ne)}"></label></div>
   <div class="two"><label>${x.cat}<input name="cat" list="cl" value="${esc(i.cat)}"><datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
   <label>${x.level}<select name="lv">${Object.entries(x.lv).map(([k,v])=>`<option value="${k}" ${i.lv===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
   <div class="two"><label>${x.setsrepsL}<input name="sets" value="${esc(i.sets)}"></label><label>${x.eqL}<input name="eq" value="${esc(i.eq)}"></label></div>
   <label>${x.vid}<input name="vid" type="url" placeholder="https://" value="${esc(i.vid)}"><span class="hint">${x.vidH}</span></label>
   <label>${x.descBg}<textarea name="db" rows="3">${esc(i.db)}</textarea></label>
   <label>${x.descEn}<textarea name="de" rows="3">${esc(i.de)}</textarea></label>
   <div class="row"><button class="btn" type="submit">${x.save}</button><button class="btn ghost" type="button" data-x="1">${x.cancel}</button>${id?`<button class="btn danger" type="button" data-d="${esc(id)}" style="margin-left:auto">${x.del}</button>`:""}</div>
  </form>`;$("formM").classList.add("open")}
const normCard=v=>String(v||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,64);
function cardUrl(code){const u=new URL("menu.html",location.href);u.search="?card="+encodeURIComponent(code);u.hash="";return u.href}
function openCard(id){const x=t(),k=S.cards.find(a=>a.id===id)||{id:"",name:"",nameEn:""};
  $("formS").innerHTML=`<button class="close" data-x="1" aria-label="${x.close}">✕</button><h2>${id?x.cardEdit:x.cardNew}</h2>
  <form id="kf" data-id="${esc(k.id)}">
   <label>${x.cardCode}<input name="code" value="${esc(k.id)}" ${id?"readonly":""} required><span class="hint">${x.cardCodeH}</span></label>
   <label>${x.cardName}<input name="name" maxlength="60" value="${esc(k.name)}" required></label>
   <label>${x.cardNameEn}<input name="nameEn" maxlength="60" value="${esc(k.nameEn||"")}"></label>
   <div class="row"><button class="btn" type="submit">${x.save}</button><button class="btn ghost" type="button" data-x="1">${x.cancel}</button>${id?`<button class="btn danger" type="button" data-kd="${esc(id)}" style="margin-left:auto">${x.del}</button>`:""}</div>
  </form>`;$("formM").classList.add("open")}
async function createAuthUser(email,pw){
  let app2;try{app2=firebase.app("creator")}catch(e){app2=firebase.initializeApp(FIREBASE_CONFIG,"creator")}
  const a2=app2.auth();
  try{const cr=await a2.createUserWithEmailAndPassword(email,pw);return cr.user.uid}
  finally{try{await a2.signOut()}catch(e){}}}
function openCreate(){const x=t();
  $("formS").innerHTML=`<button class="close" data-x="1" aria-label="${x.close}">✕</button><h2>${x.cuT}</h2><p class="hint">${x.cuSub}</p>
  <form id="uf" autocomplete="off">
   <label>${x.cuName}<input name="name" placeholder="John Smith" required></label>
   <label>${x.cuEmail}<input name="email" type="email" placeholder="user@example.com" autocomplete="off" required></label>
   <label>${x.cuPw}<span class="pw"><input name="pw" type="password" autocomplete="new-password" required><button type="button" class="eye" data-eye="1" aria-label="Show password">👁</button></span></label>
   <label>${x.cuPw2}<span class="pw"><input name="pw2" type="password" autocomplete="new-password" required><button type="button" class="eye" data-eye="1" aria-label="Show password">👁</button></span></label>
   <div class="err" id="uerr" role="alert"></div>
   <div class="row"><button class="btn" type="submit">${x.cuBtn}</button><button class="btn ghost" type="button" data-x="1">${x.close}</button></div>
  </form>`;$("formM").classList.add("open")}
function openCoach(id){const x=t(),c=S.coaches.find(a=>a.id===id)||{id:"",name:"",role:"",photo:""};
  $("formS").innerHTML=`<button class="close" data-x="1" aria-label="Close">✕</button><h2>${id?x.coachEditT:x.coachNewT}</h2>
  <form id="cf" data-id="${esc(c.id)}" data-prev="${esc(lkOf(c.id)?lkOf(c.id).id:"")}"><label>${x.coachName}<input name="name" value="${esc(c.name)}"></label>
  <label>${x.coachRole}<input name="role" value="${esc(c.role)}"></label>
  <label>${x.coachPhoto}<input name="photo" type="url" placeholder="https://" value="${esc(c.photo)}"></label>
  ${lkOf(c.id)?`<p class="hint">🔑 ${esc(lkOf(c.id).id)}</p>`:""}
  <div class="row"><button class="btn" type="submit">${x.save}</button><button class="btn ghost" type="button" data-x="1">${x.cancel}</button>${id?`<button class="btn danger" type="button" data-cd="${esc(id)}" style="margin-left:auto">${x.del}</button>`:""}</div></form>`;$("formM").classList.add("open")}
const shut=()=>$("formM").classList.remove("open");
document.addEventListener("submit",async e=>{
  if(e.target.id==="kf"){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),x=t(),code=normCard(d.code),isNew=!e.target.dataset.id;
    if(!code){toast(x.needCode);return}if(!d.name.trim()){toast(x.needName);return}
    if(isNew&&S.cards.some(k=>k.id===code)){toast(x.codeUsed);return}
    try{await saveC("cards",{id:code,code,name:d.name.trim(),nameEn:d.nameEn.trim()});shut();await refresh();toast(x.saved)}catch(er){console.error(er);toast(x.saveFail)}return}
  if(e.target.id==="uf"){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),x=t(),er=$("uerr"),btn=e.target.querySelector("[type=submit]");er.textContent="";
    const name=d.name.trim(),email=d.email.trim().toLowerCase();
    if(!name){er.textContent=x.needName;return}
    if(d.pw.length<6){er.textContent=x.pwMin;return}
    if(d.pw!==d.pw2){er.textContent=x.pwMatch;return}
    btn.disabled=true;
    try{let uid=null;if(fs)uid=await createAuthUser(email,d.pw);
      const cid=await saveC("coaches",{id:"",name,role:"",photo:""});await linkTrainer(cid,email,"",uid);
      shut();await refresh();toast(x.created)}
    catch(e2){console.error(e2);const c=e2.code||"";er.textContent=c==="auth/email-already-in-use"?x.emailUsed:/operation-not-allowed|admin-restricted/.test(c)?x.signupOff:c==="auth/weak-password"?x.pwMin:c==="auth/invalid-email"?x.badEmail:x.saveFail;btn.disabled=false}
    return}
  if(e.target.id==="cf"){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),x=t();if(!d.name.trim()){toast(x.needName);return}
    try{const cid=await saveC("coaches",{id:e.target.dataset.id,name:d.name.trim(),role:d.role.trim(),photo:d.photo.trim()});shut();await refresh();toast(x.saved)}catch(er){console.error(er);toast(x.saveFail)}return}
  if(e.target.id!=="f")return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target)),x=t();
  if(!d.nb.trim()&&!d.ne.trim()){toast(x.needName);return}
  const o={id:e.target.dataset.id,...Object.fromEntries(Object.entries(d).map(([k,v])=>[k,v.trim()]))};
  try{await save(o);shut();await refresh();toast(x.saved)}catch(er){console.error(er);toast(x.saveFail)}});
document.addEventListener("click",async e=>{
  if(e.target===$("formM"))return shut();
  const b=e.target.closest("button");if(!b)return;const x=t();
  try{
  if(b.dataset.l){S.lang=b.dataset.l;paintStatic()}
  else if(b.dataset.e)openForm(b.dataset.e);
  else if(b.dataset.t){S.tab=b.dataset.t;paintList()}
  else if(b.dataset.cae)openCard(b.dataset.cae);
  else if(b.dataset.cp){try{await navigator.clipboard.writeText(cardUrl(b.dataset.cp));toast(x.copied)}catch(er){prompt("",cardUrl(b.dataset.cp))}}
  else if(b.dataset.kd){if(confirm(x.delQk)){await removeC("cards",b.dataset.kd);shut();await refresh();toast(x.deleted)}}
  else if(b.dataset.eye){const i=b.parentElement.querySelector("input");i.type=i.type==="password"?"text":"password"}
  else if(b.dataset.ce)openCoach(b.dataset.ce);
  else if(b.dataset.r){if(fs)await fs.collection("calls").doc(b.dataset.r).update({done:true})}
  else if(b.dataset.cd){if(confirm(x.delQc)){{const l=lkOf(b.dataset.cd);if(l)await linkTrainer(b.dataset.cd,"",l.id)}await removeC("coaches",b.dataset.cd);shut();await refresh();toast(x.deleted)}}
  else if(b.dataset.x)shut();
  else if(b.dataset.d){if(confirm(x.delQ)){await remove(b.dataset.d);shut();await refresh();toast(x.deleted)}}
  else if(b.id==="seedBtn"){await bulk(SEED.map(o=>({...o,id:""})),false);await refresh()}
  }catch(er){console.error(er);toast(x.saveFail)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
$("addBtn").onclick=()=>S.tab==="co"?openCreate():S.tab==="ca"?openCard(""):openForm("");
$("expBtn").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.items,null,2)],{type:"application/json"}));a.download="tapmygym-exercises.json";document.body.appendChild(a);a.click();a.remove()};
$("impBtn").onclick=()=>$("impFile").click();
$("impFile").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const p=JSON.parse(await fl.text());if(!Array.isArray(p))throw 0;await bulk(p.map(o=>({...o,id:""})),confirm(t().csvQ));await refresh();toast(t().imported)}catch(_){toast(t().badFile)}e.target.value=""};

/* ---------- CSV import ---------- */
function parseCSV(s){s=s.replace(/^\uFEFF/,"");const f0=s.split(/\r?\n/)[0];const d=[";","\t",","].map(c=>[c,f0.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;r.push(f);f="";if(r.some(v=>v.trim()))rows.push(r);r=[]}
    else f+=c}
  r.push(f);if(r.some(v=>v.trim()))rows.push(r);return rows}
function colField(h){h=h.toLowerCase().replace(/[_\-]+/g," ").trim();
  if(/image|photo|img|снимка|снимки|price|цена|allerg|алерген/.test(h))return null;
  const bg=/(^|[^a-z])bg([^a-z]|$)|бг|bulg/.test(h),en=/(^|[^a-z])en([^a-z]|$)|engl|англ/.test(h);
  if(/name|title|dish|item|exercise|име|ястие|наименование|упражнение/.test(h))return bg?"nb":en?"ne":"n";
  if(/desc|описание|ingredient|състав|tips|съвет/.test(h))return bg?"db":en?"de":"d";
  if(/categ|категор|section|секция|group|група/.test(h))return "cat";
  if(/video|youtube|видео|link|url/.test(h))return "vid";
  if(/level|ниво/.test(h))return "lv";
  if(/sets|reps|серии|повторения/.test(h))return "sets";
  if(/equip|уред|оборуд/.test(h))return "eq";
  return null}
const lvOf=v=>{v=(v||"").toLowerCase();return /adv|напред/.test(v)?"advanced":/inter|med|сред/.test(v)?"intermediate":"beginner"};
$("csvBtn").onclick=()=>$("csvFile").click();
$("csvFile").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const rows=parseCSV(await fl.text()),map=rows[0].map(colField),out=[];
    rows.slice(1).forEach(r=>{const o={id:"",nb:"",ne:"",cat:"",lv:"beginner",sets:"",eq:"",vid:"",db:"",de:""};
      map.forEach((k,i)=>{const v=(r[i]||"").trim();if(!k||!v)return;
        if(k==="n"){o.nb=o.nb||v;o.ne=o.ne||v}else if(k==="d"){o.db=o.db||v;o.de=o.de||v}else if(k==="lv")o.lv=lvOf(v);else o[k]=v});
      if(o.nb||o.ne)out.push(o)});
    if(!out.length){toast(t().csvNone);return}
    await bulk(out,confirm(t().csvQ));await refresh();toast(out.length+t().csvN)}
  catch(er){console.error(er);toast(t().badFile)}e.target.value=""};

/* ---------- boot ---------- */
(async()=>{paintStatic();
  if(FIREBASE_CONFIG){try{const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await load(B+"firebase-app-compat.js");await load(B+"firebase-auth-compat.js");await load(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
    auth.onAuthStateChanged(u=>u?showApp():showLogin())}catch(e){console.error(e);$("err").textContent=t().fail}}
})();
</script>
