<body>
<header><div class="wrap wide bar">

  <div class="row">
    <div class="seg" role="group" aria-label="Language"><button data-l="bg" aria-pressed="true">БГ</button><button data-l="en" aria-pressed="false">EN</button></div>

<main class="wrap wide">

</main>

rd code",delQk:"Delete this card?"}};

{nb:"Лег с щанга",ne:"Barbell bench press",cat:"Гърди",lv:"intermediate",sets:"4 x 8",eq:"Щанга, лавица",vid:"",db:"Легнете на лавицата, стъпала на пода. Свалете щангата до средата на гърдите и избутайте контролирано.",de:"Lie on the bench, feet flat. Lower the bar to mid-chest and press up with control."},

{nb:"Клек",ne:"Back squat",cat:"Крака",lv:"intermediate",sets:"4 x 6",eq:"Щанга, стойка",vid:"",db:"Гръб прав, коленете следват посоката на пръстите.",de:"Keep your back straight, knees tracking over toes."},
{nb:"Планк",ne:"Plank",cat:"Корем",lv:"beginner",sets:"3 x 45 сек",eq:"Постелка",vid:"",db:"Тялото е права линия от глава до пети.",de:"Body in a straight line from head to heels."}];
let S={lang:"bg",gyms:[],g:null,tab:"info",items:[],coaches:[],cards:[],trainers:[],owners:[],reqs:[]},fs=null,auth=null,unsub=null,reqN=-1;
const $=id=>document.getElementById(id),t=()=>A[S.lang];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
function toast(m){const x=$("toast");x.textContent=m;x.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display="none",3200)}
const docs=s=>s.docs.map(d=>({...d.data(),id:d.id})),byTs=(a,b)=>(a.ts||0)-(b.ts||0);
const gc=n=>fs.collection("gyms").doc(S.g).collection(n);
const G=()=>S.gyms.find(g=>g.id===S.g);
const nm=i=>(S.lang==="en"?i.ne||i.nb:i.nb||i.ne)||"";
const normSlug=s=>String(s||"").trim().toLowerCase();
const slugify=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
const SLUG=/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/;
const normCard=v=>String(v||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,64);
const menuUrl=x=>{const u=new URL("menu.html",location.href);u.search="?gym="+encodeURIComponent(S.g)+(x||"");u.hash="";return u.href};
const cardUrl=c=>menuUrl("&card="+encodeURIComponent(c));
const av=c=>`<span class="av">${esc((c.name||"?").trim().charAt(0).toUpperCase())}${c.photo?`<img src="${esc(c.photo)}" alt="" onerror="this.remove()">`:""}</span>`;
const trOf=id=>S.trainers.find(x=>x.coachId===id);
const errText=e=>{const c=e.code||"",x=t();return c==="auth/email-already-in-use"?x.emailUsed:/operation-not-allowed|admin-restricted/.test(c)?x.signupOff:c==="auth/weak-password"?x.pwMin:c==="auth/invalid-email"?x.badEmail:x.saveFail+" ("+(c||e.message||"")+")"};
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.3)}catch(e){}}
const openModal=h=>{$("formS").innerHTML=h;$("formM").classList.add("open")};
const shut=()=>$("formM").classList.remove("open");
async function copy(u){try{await navigator.clipboard.writeText(u);toast(t().copied)}catch(e){prompt("",u)}}

/* ---------- data ---------- */
async function loadGyms(){S.gyms=docs(await fs.collection("gyms").get()).sort((a,b)=>(a.name||"").localeCompare(b.name||""))}
async function loadGym(){if(!S.g)return;
  const[a,b,c,d,ow]=await Promise.all([gc("exercises").get(),gc("coaches").get(),gc("cards").get(),fs.collection("trainers").where("gymId","==",S.g).get(),fs.collection("owners").where("gymId","==",S.g).get()]);
  S.items=docs(a).sort(byTs);S.coaches=docs(b).sort(byTs);S.cards=docs(c).sort((x,y)=>(x.name||"").localeCompare(y.name||""));S.trainers=docs(d);S.owners=docs(ow)}
async function put(col,o){const id=o.id,d={...o};delete d.id;if(id){await gc(col).doc(id).set(d,{merge:true});return id}d.ts=Date.now();return(await gc(col).add(d)).id}
async function bulkAdd(arr,replace){const c=gc("exercises");
  if(replace){const s=await c.get();for(let i=0;i<s.docs.length;i+=400){const b=fs.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
  for(let i=0;i<arr.length;i+=400){const b=fs.batch();arr.slice(i,i+400).forEach((o,n)=>{const d={...o};delete d.id;d.ts=Date.now()+i+n;b.set(c.doc(),d)});await b.commit()}}
async function wipeGym(id){const g=fs.collection("gyms").doc(id);
  for(const n of["exercises","coaches","cards","calls"]){const s=await g.collection(n).get();for(let i=0;i<s.docs.length;i+=400){const b=fs.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
  const tr=await fs.collection("trainers").where("gymId","==",id).get();for(const d of tr.docs)await d.ref.delete();
  await g.delete()}
async function createAuthUser(email,pw){
  let app2;try{app2=firebase.app("creator")}catch(e){app2=firebase.initializeApp(FIREBASE_CONFIG,"creator")}
  const a2=app2.auth();
  try{const cr=await a2.createUserWithEmailAndPassword(email,pw);return cr.user.uid}
  finally{try{await a2.signOut()}catch(e){}}}
function stopReqs(){if(unsub){unsub();unsub=null}S.reqs=[];reqN=-1}
function listenReqs(){stopReqs();if(!S.g)return;const g=S.g;
  unsub=gc("calls").where("done","==",false).onSnapshot(s=>{if(g!==S.g)return;S.reqs=docs(s).sort(byTs);if(reqN>=0&&S.reqs.length>reqN)beep();reqN=S.reqs.length;paintReqs()},e=>console.error(e))}
async function pick(id){S.g=id;S.tab="info";stopReqs();paintAll();
  try{await loadGym()}catch(e){console.error(e);toast(errText(e))}
  listenReqs();paintAll()}
async function refresh(){await loadGym();paintMain()}

/* ---------- painting ---------- */
function paintStatic(){const x=t();
  $("lT").textContent=x.lT;$("lE").textContent=x.lE;$("lP").textContent=x.lP;$("lGo").textContent=x.lGo;$("lForgot").textContent=x.forgot;
  $("outBtn").textContent=x.out;$("newBtn").textContent=x.newGym;$("adminsBtn").textContent=x.adminsBtn;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));document.documentElement.lang=S.lang;
  if(!$("app").hidden)paintAll()}
function paintAll(){paintSide();paintMain()}
function paintSide(){const x=t();
  $("gyms").innerHTML=S.gyms.length?S.gyms.map(g=>`<button class="gy ${g.id===S.g?"on":""}" data-a="gym" data-id="${esc(g.id)}"><b>${esc(g.name||g.id)}</b><small>${esc(g.id)}${g.suspended?" · "+x.suspended:""}</small></button>`).join(""):`<p class="hint">${x.noGyms}</p>`}
function paintReqs(){const r=$("reqs");if(!r)return;const x=t();
  r.innerHTML=S.reqs.map(q=>`<div class="req"><span>🔔 <b>${esc(q.coachName)}</b>${x.reqCalled}${new Date(q.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}${q.spot||q.card?` · 📍 <b>${esc(q.spot||q.card)}</b>`:""}</span><button class="btn sm" data-a="done" data-id="${esc(q.id)}">${x.done}</button></div>`).join("")}
function paintMain(){const x=t(),g=G(),m=$("main");
  if(!g){m.innerHTML=`<div class="empty">${x.pickGym}</div>`;return}
  const tabs=[["info",x.tabInfo],["ex",x.tabEx],["co",x.tabCo],["ca",x.tabCa]];
  m.innerHTML=`<div class="gh"><div><h1>${esc(g.name||g.id)}</h1><div class="hint">${esc(g.id)}${g.suspended?" · "+x.suspended:""}</div></div><a class="btn ghost sm" href="${esc(menuUrl())}" target="_blank" rel="noopener" style="text-decoration:none">${x.openMenu}</a></div>
  <div class="reqs" id="reqs" aria-live="polite"></div>
  <div class="chips">${tabs.map(([k,l])=>`<button class="chip" data-a="tab" data-id="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("")}</div>
  <div id="body">${bodyHtml(g)}</div>`;paintReqs()}
function bar(count,btns){return`<div class="admin on"><div><strong>${count}</strong></div><div class="row">${btns}</div></div>`}
function bodyHtml(g){const x=t(),tb=S.tab;
  if(tb==="info")return`<form id="gf">
   <label>${x.gymName}<input name="name" maxlength="60" value="${esc(g.name)}" required></label>
   <label>${x.gymSlug}<input value="${esc(g.id)}" readonly></label>
   <div class="two"><label>${x.gymSlogan}<input name="slogan" maxlength="90" value="${esc(g.slogan||"")}"></label><label>${x.gymSloganEn}<input name="sloganEn" maxlength="90" value="${esc(g.sloganEn||"")}"></label></div>
   <div class="two"><label>${x.gymLogo}<input name="logo" type="url" placeholder="https://" value="${esc(g.logo||"")}"></label><label>${x.gymAccent}<input name="accent" type="color" value="${esc(g.accent||"#e0a458")}" style="height:44px;padding:4px"></label></div>
   <div class="row"><button class="btn" type="submit">${x.save}</button></div></form>
   <div class="box"><div class="hint">${x.gymLink}</div><div style="word-break:break-all;margin:4px 0 10px">${esc(menuUrl())}</div>
   <div class="row"><button class="btn ghost sm" data-a="cp">${x.copyLink}</button><button class="btn ghost sm" data-a="toggle">${g.suspended?x.resume:x.suspend}</button><button class="btn danger sm" data-a="delGym" style="margin-left:auto">${x.delGym}</button></div></div>
   <div class="box"><h3>${x.ownersT}</h3><div class="hint">${x.ownersSub}</div>
   <div class="items" style="margin-top:10px">${S.owners.length?S.owners.map(w=>`<div class="it"><div><h3>${esc(w.name||w.id)}</h3><div class="meta"><span>🔑 ${esc(w.id)}</span></div></div><button class="btn danger sm" data-a="delOwner" data-id="${esc(w.id)}">${x.del}</button></div>`).join(""):`<p class="hint">${x.ownerNone}</p>`}</div>

/* ---------- CSV import ---------- */
function parseCSV(s){s=s.replace(/^\uFEFF/,"");const f0=s.split(/\r?\n/)[0];const d=[";","\t",","].map(c=>[c,f0.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;r.push(f);f="";if(r.some(v=>v.trim()))rows.push(r);r=[]}
    else f+=c}
  r.push(f);if(r.some(v=>v.trim()))rows.push(r);return rows}
function colField(h){h=h.toLowerCase().replace(/[_\-]+/g," ").trim();
  if(/image|photo|img|снимка|снимки|price|цена|allerg|алерген/.test(h))return null;
  const bg=/(^|[^a-z])bg([^a-z]|$)|бг|bulg/.test(h),en=/(^|[^a-z])en([^a-z]|$)|engl|англ/.test(h);
  if(/name|title|dish|item|exercise|име|ястие|наименование|упражнение/.test(h))return bg?"nb":en?"ne":"n";
  if(/desc|описание|ingredient|състав|tips|съвет/.test(h))return bg?"db":en?"de":"d";
  if(/categ|категор|section|секция|group|група/.test(h))return "cat";
  if(/video|youtube|видео|link|url/.test(h))return "vid";
  if(/level|ниво/.test(h))return "lv";
  if(/sets|reps|серии|повторения/.test(h))return "sets";
  if(/equip|уред|оборуд/.test(h))return "eq";
  return null}
const lvOf=v=>{v=(v||"").toLowerCase();return /adv|напред/.test(v)?"advanced":/inter|med|сред/.test(v)?"intermediate":"beginner"};

$("csvFile").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const rows=parseCSV(await fl.text()),map=rows[0].map(colField),out=[];
    rows.slice(1).forEach(r=>{const o={nb:"",ne:"",cat:"",lv:"beginner",sets:"",eq:"",vid:"",db:"",de:""};
      map.forEach((k,i)=>{const v=(r[i]||"").trim();if(!k||!v)return;
        if(k==="n"){o.nb=o.nb||v;o.ne=o.ne||v}else if(k==="d"){o.db=o.db||v;o.de=o.de||v}else if(k==="lv")o.lv=lvOf(v);else o[k]=v});
      if(o.nb||o.ne)out.push(o)});
    if(!out.length){toast(t().csvNone);return}
    await bulkAdd(out,confirm(t().csvQ));await refresh();toast(out.length+t().csvN)}
  catch(er){console.error(er);toast(t().badFile)}e.target.value=""};

/* ---------- login & boot ---------- */
function showLogin(){stopReqs();S.g=null;$("login").hidden=false;$("app").hidden=true;$("outBtn").hidden=true;$("who").hidden=true}
function showApp(u){$("login").hidden=true;$("app").hidden=false;$("outBtn").hidden=false;$("who").textContent=u.email;$("who").hidden=false;paintAll();if(S.gyms.length&&!S.g)pick(S.gyms[0].id)}
$("lf").onsubmit=async e=>{e.preventDefault();$("err").textContent="";if(!auth){$("err").textContent=t().noFb;return}
  const d=Object.fromEntries(new FormData(e.target));
  try{await auth.signInWithEmailAndPassword(d.email,d.pw)}catch(er){$("err").textContent=/invalid-credential|wrong-password|user-not-found|invalid-login/.test(er.code||"")?t().bad:t().fail}};
$("lForgot").onclick=async()=>{const m=$("lf").elements.email.value.trim();if(!m){$("err").textContent=t().needEmail;return}
  if(!auth){$("err").textContent=t().noFb;return}try{await auth.sendPasswordResetEmail(m);$("err").textContent=t().sent}catch(er){$("err").textContent=t().fail}};
$("outBtn").onclick=()=>auth&&auth.signOut();
(async()=>{paintStatic();
  if(!FIREBASE_CONFIG){$("err").textContent=t().noFb;return}
  try{const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await load(B+"firebase-app-compat.js");await load(B+"firebase-auth-compat.js");await load(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
    auth.onAuthStateChanged(async u=>{
      if(!u){showLogin();return}
      try{await loadGyms()}
      catch(er){console.error(er);if(/permission/i.test((er.code||"")+(er.message||""))){await auth.signOut();$("err").textContent=t().noAccess;return}$("err").textContent=t().fail;await auth.signOut();return}
      showApp(u)})
  }catch(e){console.error(e);$("err").textContent=t().fail}
})();
