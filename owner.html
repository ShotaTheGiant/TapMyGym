<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a09">
<title>TapMyGym - Собственик</title>

<body>
<header><div class="wrap wide bar">

</div></header>
<main class="wrap wide">

    <div class="tablet">
      <h1 id="lT"></h1>
      <form id="lf" autocomplete="on">

        <label><span id="lP"></span><input type="password" name="pw" autocomplete="current-password" required></label>

        <button class="btn" type="submit" id="lGo"></button>
        <button class="link" type="button" id="lForgot"></button>

    </div>
  </section>
  <section id="app" hidden>
    <div class="shell solo">
      <section id="main"></section>
    </div>
  </section>
</main>
<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<input type="file" id="coFile" accept="image/*" hidden>

/* ---------- data ---------- */
async function loadGyms(){const gd=await fs.collection("gyms").doc(S.g||S.owner.gymId).get();S.gyms=[{...gd.data(),id:gd.id}]}
async function loadGym(){if(!S.g)return;
  const[a,b,c,d]=await Promise.all([gc("exercises").get(),gc("coaches").get(),gc("cards").get(),fs.collection("trainers").where("gymId","==",S.g).get()]);
  S.items=docs(a).sort(byTs);S.coaches=docs(b).sort(byTs);S.cards=docs(c).sort((x,y)=>(x.name||"").localeCompare(y.name||""));S.trainers=docs(d)}
async function put(col,o){const id=o.id,d={...o};delete d.id;if(id){await gc(col).doc(id).set(d,{merge:true});return id}d.ts=Date.now();return(await gc(col).add(d)).id}
async function bulkAdd(arr,replace){const c=gc("exercises");
  if(replace){const s=await c.get();for(let i=0;i<s.docs.length;i+=400){const b=fs.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
  for(let i=0;i<arr.length;i+=400){const b=fs.batch();arr.slice(i,i+400).forEach((o,n)=>{const d={...o};delete d.id;d.ts=Date.now()+i+n;b.set(c.doc(),d)});await b.commit()}}
async function wipeGym(id){const g=fs.collection("gyms").doc(id);
  for(const n of["exercises","coaches","cards","calls"]){const s=await g.collection(n).get();for(let i=0;i<s.docs.length;i+=400){const b=fs.batch();s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref));await b.commit()}}
  const tr=await fs.collection("trainers").where("gymId","==",id).get();for(const d of tr.docs)await d.ref.delete();
  await g.delete()}
async function createAuthUser(email,pw){
  let app2;try{app2=firebase.app("creator")}catch(e){app2=firebase.initializeApp(FIREBASE_CONFIG,"creator")}
  const a2=app2.auth();
  try{const cr=await a2.createUserWithEmailAndPassword(email,pw);return cr.user.uid}
  finally{try{await a2.signOut()}catch(e){}}}
function stopReqs(){if(unsub){unsub();unsub=null}S.reqs=[];reqN=-1}
function listenReqs(){stopReqs();if(!S.g)return;const g=S.g;
  unsub=gc("calls").where("done","==",false).onSnapshot(s=>{if(g!==S.g)return;S.reqs=docs(s).sort(byTs);if(reqN>=0&&S.reqs.length>reqN)beep();reqN=S.reqs.length;paintReqs()},e=>console.error(e))}
async function pick(id){S.g=id;S.tab="info";stopReqs();paintAll();
  try{await loadGym()}catch(e){console.error(e);toast(errText(e))}
  listenReqs();paintAll()}
async function refresh(){await loadGym();paintMain()}

  $("outBtn").textContent=x.out;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));document.documentElement.lang=S.lang;
  if(!$("app").hidden)paintAll()}

/* ---------- logo ---------- */
function imgToData(file,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{let w=im.naturalWidth||max,h=im.naturalHeight||max;const k=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
    let d=c.toDataURL("image/webp",.9);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/png");ok(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("bad image"))};im.src=u})}
$("logoFile").onchange=async e=>{const fl=e.target.files[0];e.target.value="";if(!fl||!S.g)return;const x=t();
  try{let d=await imgToData(fl,512);if(d.length>600000)d=await imgToData(fl,256);if(d.length>900000){toast(x.logoBig);return}
    await fs.collection("gyms").doc(S.g).set({logo:d},{merge:true});await loadGyms();paintAll();toast(x.logoSaved)}
  catch(er){console.error(er);toast(er.code?errText(er):x.badFile)}};
function imgToSquare(file,size){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const w=im.naturalWidth||size,h=im.naturalHeight||size,m=Math.min(w,h),c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d");
    g.fillStyle="#1b1916";g.fillRect(0,0,size,size);g.drawImage(im,(w-m)/2,(h-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(u);
    let d=c.toDataURL("image/webp",.85);if(!d.startsWith("data:image/webp"))d=c.toDataURL("image/jpeg",.85);ok(d)};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error("bad image"))};im.src=u})}
const photoField=(v,name)=>{const x=t();return`<div class="logoBox" id="coPh"><div class="logoPrev round">${v?`<img src="${esc(v)}" alt="">`:`<span>${esc((name||"").trim().charAt(0).toUpperCase()||"?")}</span>`}</div><div style="flex:1;min-width:0"><div class="lbl">${x.coPhoto}</div><div class="hint">${x.coPhotoH}</div><div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-a="coPhUp">${v?x.coPhCh:x.coPhUp}</button><button class="btn ghost sm" type="button" data-a="coPhRm" ${v?"":"hidden"}>${x.logoRm}</button></div></div><input type="hidden" name="photo" value="${esc(v||"")}"></div>`};

/* ---------- ordering ---------- */
const DAYS=["mon","tue","wed","thu","fri","sat","sun"];
const exKey=i=>(i.ord??i.ts)||0;
function sortItems(a){const o=(G()&&G().catOrder)||[],first={};a.forEach((i,n)=>{const c=i.cat||"";if(!(c in first))first[c]=n});
  const ci=c=>c===""?2e9:(o.indexOf(c)<0?1e9:o.indexOf(c));
  return[...a].sort((p,q)=>{const cp=p.cat||"",cq=q.cat||"";return(ci(cp)-ci(cq))||(first[cp]-first[cq])||(exKey(p)-exKey(q))})}
const catList=()=>[...new Set(sortItems(S.items).map(i=>i.cat||""))];
function exGroups(){const x=t(),cats=catList(),all=sortItems(S.items);
  return cats.map((c,ci)=>{const list=all.filter(i=>(i.cat||"")===c);
    return`<div class="cgrp"><div class="cgh"><div class="mv"><button class="mvb" data-a="catUp" data-id="${esc(c)}" aria-label="${x.up}" ${ci===0?"disabled":""}>▲</button><button class="mvb" data-a="catDn" data-id="${esc(c)}" aria-label="${x.down}" ${ci===cats.length-1?"disabled":""}>▼</button></div><h3>${esc(c||x.noCat)}</h3><span class="hint">${list.length}</span></div>
    ${list.map((i,n)=>`<div class="it"><div class="mv"><button class="mvb" data-a="exUp" data-id="${esc(i.id)}" aria-label="${x.up}" ${n===0?"disabled":""}>▲</button><button class="mvb" data-a="exDn" data-id="${esc(i.id)}" aria-label="${x.down}" ${n===list.length-1?"disabled":""}>▼</button></div><div style="flex:1;min-width:0"><h3>${esc(nm(i))}</h3><div class="meta"><span>${esc(x.lv[i.lv]||"")}</span>${i.sets?`<span>${esc(i.sets)}</span>`:""}<span>${i.vid?"▶":"-"}</span></div></div><button class="btn ghost sm" data-a="editEx" data-id="${esc(i.id)}">${x.edit}</button></div>`).join("")}</div>`}).join("")}
async function moveCat(c,dir){const l=catList(),i=l.indexOf(c),j=i+dir;if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];
  const g=G();const prev=g.catOrder;g.catOrder=l;paintMain();
  try{await fs.collection("gyms").doc(S.g).set({catOrder:l},{merge:true})}catch(e){g.catOrder=prev;paintMain();throw e}}
async function moveEx(id,dir){const it=S.items.find(i=>i.id===id);if(!it)return;const c=it.cat||"",l=sortItems(S.items).filter(i=>(i.cat||"")===c),i=l.indexOf(it),j=i+dir;if(j<0||j>=l.length)return;
  [l[i],l[j]]=[l[j],l[i]];l.forEach((e,n)=>e.ord=n);paintMain();
  const b=fs.batch();l.forEach((e,n)=>b.update(gc("exercises").doc(e.id),{ord:n}));
  try{await b.commit()}catch(e){await refresh();throw e}}

/* ---------- statistics ---------- */
S.stRange=7;S.st=null;S.stBusy=false;
const dayKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function rangeDays(r){const a=[],d0=new Date();d0.setHours(12,0,0,0);for(let i=r-1;i>=0;i--){const d=new Date(d0);d.setDate(d0.getDate()-i);a.push(d)}return a}
async function loadStats(){const g=S.g,r=S.stRange,days=rangeDays(r),sk=dayKey(days[0]),start=new Date(days[0]).setHours(0,0,0,0);
  const[a,b]=await Promise.all([gc("stats").where("d",">=",sk).get(),gc("calls").where("ts",">=",start).get()]);
  if(g===S.g)S.st={g,r,days:docs(a),calls:docs(b)}}
const addMap=(o,m)=>{for(const k in m||{})o[k]=(o[k]||0)+(+m[k]||0);return o};
const sum=a=>a.reduce((p,v)=>p+v,0);
const fmtMin=ms=>{const m=Math.round(ms/60000),x=t();return(m<1?"<1":m)+" "+x.stMin};
const fmtDay=d=>String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
function barsHtml(vals,tip,labels,cls){const mx=Math.max(1,...vals);
  return`<div class="bars ${cls||""}" role="img">${vals.map((v,i)=>`<div class="bc" data-tip="${esc(tip(i,v))}"><i style="height:${v?Math.max(3,v/mx*100):0}%"></i></div>`).join("")}</div><div class="bx">${labels.map(l=>`<span>${esc(l)}</span>`).join("")}</div>`}
function rankHtml(rows){const x=t();if(!rows.length)return`<p class="hint" style="margin-top:12px">${x.stNone}</p>`;const mx=Math.max(1,...rows.map(r=>r[1]));
  return`<div class="rank">${rows.map(([n,v,sub])=>`<div><div class="rkt"><span>${esc(n)}</span><b>${v}</b></div>${sub?`<div class="hint">${esc(sub)}</div>`:""}<div class="rkb"><i style="width:${v/mx*100}%"></i></div></div>`).join("")}</div>`}
function statsHtml(){const x=t(),st=S.st,r=S.stRange;
  const rng=`<div class="chips st-range">${[7,30,90].map(n=>`<button class="chip" data-a="stR" data-id="${n}" aria-pressed="${r===n}">${n} ${x.stDays}</button>`).join("")}</div>`;
  if(!st||st.g!==S.g||st.r!==r){
    if(!S.stBusy){S.stBusy=true;loadStats().catch(e=>{console.error(e);S.st={g:S.g,r,err:errText(e),days:[],calls:[]}}).finally(()=>{S.stBusy=false;if(S.tab==="st")paintMain()})}
    return rng+`<div class="empty">${x.stLoading}</div>`}
  const days=rangeDays(r),keys=days.map(dayKey),byDay={};st.days.forEach(d=>{if(keys.includes(d.d))byDay[d.d]=d});
  const views=keys.map(k=>+(byDay[k]&&byDay[k].views)||0),cards={},ex={},hrs={};
  Object.values(byDay).forEach(d=>{addMap(cards,d.cards);addMap(ex,d.ex);addMap(hrs,d.h)});
  const tv=sum(views),ts=sum(Object.values(cards)),te=sum(Object.values(ex));
  const calls=st.calls,done=calls.filter(c=>c.done).length,rt=calls.filter(c=>c.doneTs&&c.ts&&c.doneTs>=c.ts).map(c=>c.doneTs-c.ts);
  const kpi=(l,v,s)=>`<div class="kpi"><small>${l}</small><b>${v}</b>${s?`<span>${s}</span>`:""}</div>`;
  let h=rng+`<div class="kpis">${kpi(x.stViews,tv)}${kpi(x.stScans,ts,tv?Math.round(ts/tv*100)+"%"+x.stOf:"")}${kpi(x.stEx,te)}${kpi(x.stCalls,calls.length,calls.length?done+x.stAns:"")}${kpi(x.stResp,rt.length?fmtMin(sum(rt)/rt.length):"—",rt.length?"":x.stRespNa)}</div>`;
  if(st.err)h+=`<p class="err">${esc(st.err)}</p>`;
  if(!tv&&!calls.length)return h+`<div class="empty">${x.stNoData}</div><p class="hint" style="margin-top:12px">${x.stNote}</p>`;
  const mid=Math.floor((days.length-1)/2);
  const hv=[...Array(24)].map((_,i)=>+(hrs[String(i).padStart(2,"0")]||0));
  const exRows=Object.entries(ex).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([id,v])=>{const i=S.items.find(a=>a.id===id);return[i?nm(i):x.stGone,v]});
  const caRows=Object.entries(cards).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([c,v])=>{const k=S.cards.find(a=>a.id===c);return[k?(S.lang==="en"&&k.nameEn?k.nameEn:k.name)||c:c,v,k&&k.name?c:""]});
  const co={};calls.forEach(c=>{const k=c.coachId||c.coachName||"?",o=co[k]||(co[k]={n:c.coachName||"?",c:0,d:0,rt:[]});o.c++;if(c.done)o.d++;if(c.doneTs&&c.ts&&c.doneTs>=c.ts)o.rt.push(c.doneTs-c.ts)});
  const coRows=Object.values(co).sort((a,b)=>b.c-a.c).map(o=>[o.n,o.c,o.d+x.stAns+(o.rt.length?" · ⌀ "+fmtMin(sum(o.rt)/o.rt.length):"")]);
  h+=`<div class="stgrid">
   <div class="box st-wide"><div class="bh"><h3>${x.stDaily}</h3><span class="hint">${x.stMax}${Math.max(...views)}${x.stPerDay}</span></div>
    ${barsHtml(views,(i,v)=>fmtDay(days[i])+" · "+v,[fmtDay(days[0]),days.length>2?fmtDay(days[mid]):"",fmtDay(days[days.length-1])],r>30?"dense":"")}</div>
   <div class="box"><div class="bh"><h3>${x.stHours}</h3><span class="hint">${x.stMax}${Math.max(...hv)}${x.stPerH}</span></div>
    ${barsHtml(hv,(i,v)=>String(i).padStart(2,"0")+":00 · "+v,["00","06","12","18","23"],"sm")}</div>
   <div class="box"><h3>${x.stCoaches}</h3>${rankHtml(coRows)}</div>
   <div class="box"><h3>${x.stTopEx}</h3>${rankHtml(exRows)}</div>
   <div class="box"><h3>${x.stTopCards}</h3>${rankHtml(caRows)}</div>
  </div><p class="hint" style="margin-top:14px">${x.stNote}</p>`;
  return h}

  if(fid==="lf")return;

  const bad=m=>{if(eb)eb.textContent=m;else toast(m)};
  if(eb)eb.textContent="";if(btn)btn.disabled=true;
  try{
    if(fid==="gf"){const hours={};DAYS.forEach(k=>{const o=(d["h_"+k+"_o"]||"").trim(),c=(d["h_"+k+"_c"]||"").trim(),xx=!!d["h_"+k+"_x"];if(xx||o||c)hours[k]={o,c,x:xx}});
      await fs.collection("gyms").doc(S.g).update({name:d.name.trim(),slogan:d.slogan.trim(),sloganEn:d.sloganEn.trim(),motto:d.motto.trim(),mottoEn:d.mottoEn.trim(),phone:d.phone.trim(),accent:d.accent,wifi:{n:d.wifiName.trim(),p:d.wifiPw.trim()},hours});await loadGyms();paintAll();toast(x.saved)}
    else if(fid==="nf"){const slug=d.slug.trim().toLowerCase(),name=d.gname.trim();
      if(!name){bad(x.needName);return}if(!SLUG.test(slug)){bad(x.slugBad);return}
      if((await fs.collection("gyms").doc(slug).get()).exists){bad(x.slugUsed);return}
      await fs.collection("gyms").doc(slug).set({name,slogan:"",sloganEn:"",logo:"",accent:"#c9a96e",suspended:false,ts:Date.now()});
      await loadGyms();shut();await pick(slug);toast(x.gymCreated)}
    else if(fid==="xf"){if(!d.nb.trim()&&!d.ne.trim()){bad(x.needName);return}
      const o={id:f.dataset.id};for(const k of["nb","ne","cat","lv","sets","eq","vid","db","de"])o[k]=(d[k]||"").trim();
      await put("exercises",o);shut();await refresh();toast(x.saved)}
    else if(fid==="cf"){if(!d.name.trim()){bad(x.needName);return}
      await put("coaches",{id:f.dataset.id,name:d.name.trim(),role:d.role.trim(),photo:d.photo.trim()});shut();await refresh();toast(x.saved)}
    else if(fid==="uf"){const name=d.name.trim(),email=d.email.trim().toLowerCase();
      if(!name){bad(x.needName);return}if(d.pw.length<6){bad(x.pwMin);return}if(d.pw!==d.pw2){bad(x.pwMatch);return}
      const uid=await createAuthUser(email,d.pw);
      const cid=await put("coaches",{id:"",name,role:"",photo:d.photo||""});
      await fs.collection("trainers").doc(email).set({gymId:S.g,coachId:cid,uid,name});
      shut();await refresh();toast(x.created)}
    else if(fid==="kf"){const code=normCard(d.code);if(!code){bad(x.needCode);return}if(!d.name.trim()){bad(x.needName);return}
      if(!f.dataset.id&&S.cards.some(k=>k.id===code)){bad(x.codeUsed);return}
      await gc("cards").doc(code).set({code,name:d.name.trim(),nameEn:d.nameEn.trim()},{merge:true});shut();await refresh();toast(x.saved)}
    else if(fid==="af"){const name=d.name.trim(),email=d.email.trim().toLowerCase();
      if(!name){bad(x.needName);return}if(d.pw.length<6){bad(x.pwMin);return}if(d.pw!==d.pw2){bad(x.pwMatch);return}
      const uid=await createAuthUser(email,d.pw);
      await fs.collection("admins").doc(email).set({name,uid,ts:Date.now()});
      await openAdmins();toast(x.created)}
  }catch(er){console.error(er);bad(errText(er))}
  finally{if(btn)btn.disabled=false}});

/* ---------- CSV import ---------- */
function parseCSV(s){s=s.replace(/^\uFEFF/,"");const f0=s.split(/\r?\n/)[0];const d=[";","\t",","].map(c=>[c,f0.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){r.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;r.push(f);f="";if(r.some(v=>v.trim()))rows.push(r);r=[]}
    else f+=c}
  r.push(f);if(r.some(v=>v.trim()))rows.push(r);return rows}
function colField(h){h=h.toLowerCase().replace(/[_\-]+/g," ").trim();
  if(/image|photo|img|снимка|снимки|price|цена|allerg|алерген/.test(h))return null;
  const bg=/(^|[^a-z])bg([^a-z]|$)|бг|bulg/.test(h),en=/(^|[^a-z])en([^a-z]|$)|engl|англ/.test(h);
  if(/name|title|dish|item|exercise|име|ястие|наименование|упражнение/.test(h))return bg?"nb":en?"ne":"n";
  if(/desc|описание|ingredient|състав|tips|съвет/.test(h))return bg?"db":en?"de":"d";
  if(/categ|категор|section|секция|group|група/.test(h))return "cat";
  if(/video|youtube|видео|link|url/.test(h))return "vid";
  if(/level|ниво/.test(h))return "lv";
  if(/sets|reps|серии|повторения/.test(h))return "sets";
  if(/equip|уред|оборуд/.test(h))return "eq";
  return null}
const lvOf=v=>{v=(v||"").toLowerCase();return /adv|напред/.test(v)?"advanced":/inter|med|сред/.test(v)?"intermediate":"beginner"};

$("csvFile").onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const rows=parseCSV(await fl.text()),map=rows[0].map(colField),out=[];
    rows.slice(1).forEach(r=>{const o={nb:"",ne:"",cat:"",lv:"beginner",sets:"",eq:"",vid:"",db:"",de:""};
      map.forEach((k,i)=>{const v=(r[i]||"").trim();if(!k||!v)return;
        if(k==="n"){o.nb=o.nb||v;o.ne=o.ne||v}else if(k==="d"){o.db=o.db||v;o.de=o.de||v}else if(k==="lv")o.lv=lvOf(v);else o[k]=v});
      if(o.nb||o.ne)out.push(o)});
    if(!out.length){toast(t().csvNone);return}
    await bulkAdd(out,confirm(t().csvQ));await refresh();toast(out.length+t().csvN)}
  catch(er){console.error(er);toast(t().badFile)}e.target.value=""};

/* ---------- login & boot ---------- */
function showLogin(){stopReqs();S.g=null;$("login").hidden=false;$("app").hidden=true;$("outBtn").hidden=true;$("who").hidden=true}
function showApp(u){$("login").hidden=true;$("app").hidden=false;$("outBtn").hidden=false;$("who").textContent=u.email;$("who").hidden=false;paintAll();if(S.gyms.length&&!S.g)pick(S.gyms[0].id)}
$("lf").onsubmit=async e=>{e.preventDefault();$("err").textContent="";if(!auth){$("err").textContent=t().noFb;return}
  const d=Object.fromEntries(new FormData(e.target));
  try{await auth.signInWithEmailAndPassword(d.email,d.pw)}catch(er){$("err").textContent=/invalid-credential|wrong-password|user-not-found|invalid-login/.test(er.code||"")?t().bad:t().fail}};
$("lForgot").onclick=async()=>{const m=$("lf").elements.email.value.trim();if(!m){$("err").textContent=t().needEmail;return}
  if(!auth){$("err").textContent=t().noFb;return}try{await auth.sendPasswordResetEmail(m);$("err").textContent=t().sent}catch(er){$("err").textContent=t().fail}};
$("outBtn").onclick=()=>auth&&auth.signOut();
(async()=>{paintStatic();
  if(!FIREBASE_CONFIG){$("err").textContent=t().noFb;return}
  try{const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await load(B+"firebase-app-compat.js");await load(B+"firebase-auth-compat.js");await load(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
    auth.onAuthStateChanged(async u=>{
      if(!u){showLogin();return}
      try{const od=await fs.collection("owners").doc((u.email||"").toLowerCase()).get();
        if(!od.exists||od.data().uid!==u.uid){await auth.signOut();$("err").textContent=t().noAccess;return}
        S.owner=od.data();await loadGyms();
        if(!S.gyms[0]||!S.gyms[0].name&&!S.gyms[0].id){await auth.signOut();$("err").textContent=t().noAccess;return}
        showApp(u)}
      catch(er){console.error(er);$("err").textContent=/permission/i.test((er.code||"")+(er.message||""))?t().noAccess:t().fail;await auth.signOut()}})
  }catch(e){console.error(e);$("err").textContent=t().fail}
})();
