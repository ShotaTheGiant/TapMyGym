<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1410">
<title>TapMyGym - Меню с упражнения</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap bar">
  <div class="logo">Tap<b>My</b>Gym</div>
  <div class="seg" role="group" aria-label="Language"><button data-l="bg" aria-pressed="true">БГ</button><button data-l="en" aria-pressed="false">EN</button></div>
</div></header>
<main class="wrap">
  <section class="hero">
    <div><h1 id="hTitle"></h1><p id="hSub"></p></div>
    <div class="tablet"><div class="tap">📲</div><strong id="tabT"></strong><small id="tabS"></small></div>
  </section>
  <div class="tools"><input type="search" id="q"><select id="lvl"></select></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>© 2026 TapMyGym</footer>
<button class="fab" id="fab" type="button"></button>
<div class="modal" id="coachM" role="dialog" aria-modal="true"><div class="sheet" id="coachS"></div></div>
<div class="notice" id="notice" role="status" hidden><span id="noticeT"></span><button type="button" id="noticeX" aria-label="Close">✕</button></div>
<div class="modal" id="viewM" role="dialog" aria-modal="true"><div class="sheet" id="viewS"></div></div>

<script src="firebase-config.js"></script>
<script>
/* Firebase config lives in firebase-config.js. Collections used: exercises, coaches, calls. */

const T={
bg:{title:"Тренировъчното меню, което е в джоба ви.",sub:"Докоснете таблета или сканирайте QR кода и вижте упражненията с видео, серии и повторения - на вашия телефон, на вашия език.",tabT:"Докоснете с телефона",tabS:"Без приложение",coach:"Повикай треньор",pick:"Изберете треньор",noCoach:"Още няма добавени треньори.",coming:"Треньорът {n} идва. Застанете там, където докоснахте менюто.",callFail:"Не успяхме да извикаме треньора. Опитайте пак.",search:"Търси упражнение",all:"Всички",lvlAll:"Всички нива",lv:{beginner:"Начинаещ",intermediate:"Среден",advanced:"Напреднал"},sets:"Серии",eq:"Уред",empty:"Няма упражнения.",noVideo:"Още няма видео",watch:"Гледай",openV:"Отвори видеото в нов раздел"},
en:{title:"The workout menu that lives in your pocket.",sub:"Tap the tablet or scan the QR code to see exercises with video, sets and reps - on your own phone, in your own language.",tabT:"Tap with your phone",tabS:"No app needed",coach:"Call a coach",pick:"Choose a coach",noCoach:"No coaches added yet.",coming:"Trainer {n} is coming. Stand where you tapped the gym menu.",callFail:"We could not call the trainer. Please try again.",search:"Search exercises",all:"All",lvlAll:"All levels",lv:{beginner:"Beginner",intermediate:"Intermediate",advanced:"Advanced"},sets:"Sets",eq:"Equipment",empty:"No exercises.",noVideo:"No video yet",watch:"Watch",openV:"Open the video in a new tab"}};
const SEED=[
{id:"s1",nb:"Лег с щанга",ne:"Barbell bench press",cat:"Гърди",lv:"intermediate",sets:"4 x 8",eq:"Щанга, лавица",vid:"",db:"Легнете на лавицата, стъпала на пода. Свалете щангата до средата на гърдите и избутайте контролирано.",de:"Lie on the bench, feet flat. Lower the bar to mid-chest and press up with control."},
{id:"s2",nb:"Набирания",ne:"Pull-ups",cat:"Гръб",lv:"intermediate",sets:"3 x 8",eq:"Лост",vid:"",db:"Хват малко по-широк от раменете. Дръпнете брадичката над лоста без люлеене.",de:"Grip just wider than shoulders. Pull your chin over the bar without swinging."},
{id:"s3",nb:"Клек",ne:"Back squat",cat:"Крака",lv:"intermediate",sets:"4 x 6",eq:"Щанга, стойка",vid:"",db:"Гръб прав, коленете следват посоката на пръстите. Слезте до успоредно или по-ниско.",de:"Keep your back straight, knees tracking over toes. Descend to parallel or lower."},
{id:"s4",nb:"Раменна преса с дъмбели",ne:"Dumbbell shoulder press",cat:"Рамене",lv:"beginner",sets:"3 x 10",eq:"Дъмбели",vid:"",db:"Седнете с изправен гръб и избутайте дъмбелите над главата.",de:"Sit tall and press the dumbbells overhead."},
{id:"s5",nb:"Планк",ne:"Plank",cat:"Корем",lv:"beginner",sets:"3 x 45 сек",eq:"Постелка",vid:"",db:"Тялото е права линия от глава до пети. Стегнете корема и дишайте равномерно.",de:"Body in a straight line from head to heels. Brace your abs and breathe steadily."}];
const KEY="tmg.v1";
let S={lang:"bg",cat:"",q:"",lv:"",items:[],coaches:[],last:{},card:"",spotDoc:null},fs=null;
const normCard=s=>String(s||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"").slice(0,64);
(function(){try{const c=normCard(new URLSearchParams(location.search).get("card"));if(c)sessionStorage.setItem("tmg.card",c);S.card=normCard(sessionStorage.getItem("tmg.card"))}catch(e){}})();
const spotName=()=>S.spotDoc?(S.lang==="en"&&S.spotDoc.nameEn?S.spotDoc.nameEn:S.spotDoc.name)||"":"";
const loc=()=>spotName()?`<p class="hint">📍 ${esc(spotName())}</p>`:"";
async function getSpot(){if(!S.card)return;
  try{if(fs){const d=await fs.collection("cards").doc(S.card).get();S.spotDoc=d.exists?d.data():null}
  else{const a=JSON.parse(localStorage.getItem("tmg.cards")||"[]");S.spotDoc=a.find(x=>x.id===S.card)||null}}catch(e){console.error(e)}}
const $=id=>document.getElementById(id),t=()=>T[S.lang];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const load=u=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function getItems(){
  if(FIREBASE_CONFIG){try{const B="https://www.gstatic.com/firebasejs/10.12.2/";
    await load(B+"firebase-app-compat.js");await load(B+"firebase-firestore-compat.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    fs=firebase.firestore();const s=await fs.collection("exercises").get();
    return s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0))}catch(e){console.error(e)}}
  try{const r=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(r))return r}catch(e){}
  return SEED}
const nm=i=>(S.lang==="en"?i.ne||i.nb:i.nb||i.ne)||"",ds=i=>(S.lang==="en"?i.de||i.db:i.db||i.de)||"";
function embed(u){if(!u)return null;u=u.trim();let m;
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/)))return{k:"f",src:"https://www.youtube.com/embed/"+m[1]+"?rel=0"};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))return{k:"f",src:"https://player.vimeo.com/video/"+m[1]};
  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(u))return{k:"v",src:u};
  return{k:"l",src:u}}
function paintStatic(){const x=t();
  $("hTitle").textContent=x.title;$("hSub").textContent=x.sub;$("tabT").textContent=x.tabT;$("tabS").textContent=x.tabS+(spotName()?" · 📍 "+spotName():"");$("q").placeholder=x.search;
  $("fab").innerHTML='<span aria-hidden="true">📞</span><b>'+x.coach+"</b>";
  const l=$("lvl");l.innerHTML=`<option value="">${x.lvlAll}</option>`+Object.entries(x.lv).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");l.value=S.lv;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===S.lang));document.documentElement.lang=S.lang}
function paint(){const x=t();
  const cats=[...new Set(S.items.map(i=>i.cat).filter(Boolean))];
  $("chips").innerHTML=[["",x.all],...cats.map(c=>[c,c])].map(([v,l])=>`<button class="chip" data-c="${esc(v)}" aria-pressed="${S.cat===v}">${esc(l)}</button>`).join("");
  const q=S.q.toLowerCase();
  const list=S.items.filter(i=>(!S.cat||i.cat===S.cat)&&(!S.lv||i.lv===S.lv)&&(!q||((i.nb||"")+" "+(i.ne||"")+" "+(i.cat||"")).toLowerCase().includes(q)));
  $("grid").innerHTML=list.length?list.map(i=>`<article class="card">
    <button class="thumb ${i.vid?"":"none"}" data-v="${esc(i.id)}" aria-label="${esc(nm(i))}"><span class="badge">${esc(i.cat||"")}</span><span class="play">${i.vid?"▶":"•"}</span></button>
    <div class="body"><h3>${esc(nm(i))}</h3>
    <div class="meta">${i.sets?`<div>${x.sets}: <span>${esc(i.sets)}</span></div>`:""}<div><span>${esc(x.lv[i.lv]||"")}</span></div></div>
    ${i.eq?`<div class="meta">${x.eq}: <span>${esc(i.eq)}</span></div>`:""}</div></article>`).join(""):`<div class="empty">${x.empty}</div>`}
function openView(id){const i=S.items.find(a=>a.id===id);if(!i)return;const x=t(),e=embed(i.vid);
  let v=`<div class="video"><span class="hint">${x.noVideo}</span></div>`;
  if(e&&e.k==="f")v=`<div class="video"><iframe src="${esc(e.src)}" allow="accelerometer;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="${esc(nm(i))}"></iframe></div>`;
  if(e&&e.k==="v")v=`<div class="video"><video src="${esc(e.src)}" controls playsinline></video></div>`;
  if(e&&e.k==="l")v=`<div class="video"><a class="btn" href="${esc(e.src)}" target="_blank" rel="noopener">${x.watch}</a></div>`;
  $("viewS").innerHTML=`<button class="close" data-x="1" aria-label="Close">✕</button><h2>${esc(nm(i))}</h2>${v}
  ${e&&e.k!=="l"?`<a class="hint" href="${esc(e.k==="f"?i.vid:e.src)}" target="_blank" rel="noopener">${x.openV}</a>`:""}
  <div class="pills">${i.cat?`<span class="pill">${esc(i.cat)}</span>`:""}<span class="pill">${esc(x.lv[i.lv]||"")}</span>${i.sets?`<span class="pill">${x.sets}: ${esc(i.sets)}</span>`:""}${i.eq?`<span class="pill">${esc(i.eq)}</span>`:""}</div>
  <p class="desc">${esc(ds(i))}</p>`;$("viewM").classList.add("open")}
const av=c=>`<span class="av">${esc((c.name||"?").trim().charAt(0).toUpperCase())}${c.photo?`<img src="${esc(c.photo)}" alt="" onerror="this.remove()">`:""}</span>`;
async function getCoaches(){
  if(fs){try{const s=await fs.collection("coaches").get();return s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.ts||0)-(b.ts||0))}catch(e){console.error(e);return[]}}
  try{const r=JSON.parse(localStorage.getItem("tmg.coaches"));if(Array.isArray(r))return r}catch(e){}
  return[]}
async function openCoach(){const x=t();
  $("coachS").innerHTML=`<button class="close" data-cx="1" aria-label="Close">✕</button><h2>${x.pick}</h2>${loc()}<div class="coaches"></div>`;$("coachM").classList.add("open");
  S.coaches=await getCoaches();
  $("coachS").innerHTML=`<button class="close" data-cx="1" aria-label="Close">✕</button><h2>${x.pick}</h2>${loc()}<div class="coaches">${S.coaches.length?S.coaches.map(c=>`<button class="coach" data-k="${esc(c.id)}">${av(c)}<span><b>${esc(c.name)}</b><small>${esc(c.role||"")}</small></span></button>`).join(""):`<p class="hint">${x.noCoach}</p>`}</div>`}
const closeCoach=()=>$("coachM").classList.remove("open");
let nt;function showNotice(m){$("noticeT").textContent=m;$("notice").hidden=false;clearTimeout(nt);nt=setTimeout(()=>$("notice").hidden=true,12000)}
async function pickCoach(id){const c=S.coaches.find(a=>a.id===id);if(!c)return;closeCoach();
  if(fs&&Date.now()-(S.last[id]||0)>60000){
    try{const d={coachId:c.id,coachName:c.name,ts:Date.now(),done:false};if(S.card)d.card=S.card;if(S.spotDoc&&S.spotDoc.name)d.spot=String(S.spotDoc.name).slice(0,79);await fs.collection("calls").add(d);S.last[id]=Date.now()}
    catch(e){console.error(e);showNotice(t().callFail);return}}
  showNotice(t().coming.replace("{n}",c.name)+(spotName()?"\n📍 "+spotName():""))}
$("noticeX").onclick=()=>{$("notice").hidden=true};
const shut=()=>{$("viewM").classList.remove("open");$("viewS").innerHTML=""};
document.addEventListener("click",e=>{
  if(e.target===$("viewM"))return shut();
  if(e.target===$("coachM"))return closeCoach();
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;paintStatic();paint()}
  else if(b.classList.contains("chip")){S.cat=b.dataset.c;paint()}
  else if(b.dataset.v)openView(b.dataset.v);
  else if(b.dataset.x)shut();
  else if(b.dataset.k)pickCoach(b.dataset.k);
  else if(b.dataset.cx)closeCoach();
  else if(b.id==="fab")openCoach()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){shut();closeCoach()}});
$("q").oninput=e=>{S.q=e.target.value;paint()};$("lvl").onchange=e=>{S.lv=e.target.value;paint()};
paintStatic();getItems().then(i=>{S.items=i;paint();return getSpot()}).then(()=>paintStatic());
</script>
</body>
</html>
